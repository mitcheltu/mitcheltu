name: Refresh profile cards

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/profile-cards.yml
      - scripts/validate_profile_cards.py

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@e722eded97059b31d7e8ad3ae0267b74ff24172d
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: mitcheltu
          THEME: github_dark
          AUTO_PUSH: false

      # The generator may log an API error without failing its step.
      # Validate the complete batch before committing anything.
      - name: Validate all displayed cards
        run: python3 scripts/validate_profile_cards.py

      - name: Publish successful refresh
        shell: bash
        run: |
          set -euo pipefail
          git add -- profile-summary-card-output/github_dark/0-profile-details.svg \
            profile-summary-card-output/github_dark/1-repos-per-language.svg \
            profile-summary-card-output/github_dark/3-stats.svg
          if git diff --cached --quiet; then
            echo "Cards are unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile cards'
          git push origin HEAD:master
